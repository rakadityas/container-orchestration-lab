# Settings live OUTSIDE the image (lesson 4), so one image works in every
# environment. The Go app reads all of these with os.Getenv().
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: demo
data:
  # Values must be STRINGS. `PORT: 8080` without quotes is rejected.
  PORT: "8080"
  # "redis" is the Service name from 03-redis.yaml. Cluster DNS resolves it,
  # exactly like Compose service names did in the Docker course.
  REDIS_ADDR: "redis:6379"

---
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: demo
type: Opaque
# ⚠️ REMEMBER (lesson 4): this is base64, which is NOT encryption. Anyone with
# read access runs one command and sees these values:
#     kubectl get secret api-secrets -n demo -o jsonpath='{.data.DATABASE_URL}' | base64 -d
#
# It is acceptable here ONLY because this is a throwaway local cluster with a
# throwaway password. In production, do not write this file at all — generate
# it with External Secrets Operator from AWS Secrets Manager (lesson 4).
#
# `stringData` lets us type plain text; Kubernetes encodes it for us.
stringData:
  POSTGRES_PASSWORD: "postgres"
  DATABASE_URL: "postgres://postgres:postgres@postgres:5432/appdb?sslmode=disable"
