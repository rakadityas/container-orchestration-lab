# The identity our API pods run as (lesson 5).
#
# Notice what is NOT here: no Role and no RoleBinding.
#
# That is deliberate and it is the correct, safest configuration. Our Go API
# never calls the Kubernetes API — it only talks to Postgres and Redis. So it
# needs ZERO Kubernetes permissions.
#
# Always start at zero permissions and add one only when something real
# fails.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: demo

# By default Kubernetes mounts a working cluster login token into every pod
# at /var/run/secrets/kubernetes.io/serviceaccount/token.
#
# Our app never uses it, so mounting it only helps an attacker who gets into
# the container. Turn it off.
automountServiceAccountToken: false
