# Explicit allow rules (lesson 4), opened one relationship at a time on top
# of the default-deny policy.
---
# Let the ingress gateway reach the API.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: api-allow-ingress
  namespace: demo
spec:
  selector:
    matchLabels:
      app: api
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"]
      to:
        - operation:
            methods: ["GET", "POST"]

---
# Let the api ServiceAccount reach Postgres — nobody else.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: postgres-allow-api
  namespace: demo
spec:
  selector:
    matchLabels:
      app: postgres
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/demo/sa/api"]
      to:
        - operation:
            ports: ["5432"]

---
# Let the api ServiceAccount reach Redis — nobody else.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: redis-allow-api
  namespace: demo
spec:
  selector:
    matchLabels:
      app: redis
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/demo/sa/api"]
      to:
        - operation:
            ports: ["6379"]
